---
- name: Permanently delete the specified deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Perform normal teardown and permanent deletion
      cloudchef.smartcmp.deployment:
        base_url: "{{ cmp_base_url }}"
        auth_type: credential
        username: "{{ cmp_username }}"
        password: "{{ cmp_password }}"
        deployment_id: "{{ cmp_test_deployment_id }}"
        state: absent
        wait: true
      register: removal
