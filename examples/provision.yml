---
- name: Provision resources using fixed catalog configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    group/cloudchef.smartcmp.smartcmp:
      base_url: "{{ cmp_base_url }}"
      auth_type: credential
      username: "{{ cmp_username }}"
      password: "{{ cmp_password }}"
      validate_certs: "{{ cmp_validate_certs | default(true) }}"
  tasks:
    - name: Submit one request and wait
      cloudchef.smartcmp.catalog_request:
        catalog_id: "{{ cmp_catalog_id }}"
        business_group_id: "{{ cmp_business_group_id }}"
        name: "{{ cmp_request_name }}"
        count: 1
        resource_specs: "{{ cmp_resource_specs }}"
        wait: true
      register: provision
    - name: Display all recovery identifiers
      ansible.builtin.debug:
        var: provision.requests
