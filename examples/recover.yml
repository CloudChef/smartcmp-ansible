---
- name: Resume waiting with a known internal request ID
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Resume the query without submitting a new request
      cloudchef.smartcmp.request_info:
        base_url: "{{ cmp_base_url }}"
        auth_type: credential
        username: "{{ cmp_username }}"
        password: "{{ cmp_password }}"
        request_id: "{{ cmp_request_id }}"
        wait: true
        include_outputs: true
      register: request_status
